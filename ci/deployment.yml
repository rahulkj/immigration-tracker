apiVersion: apps/v1
kind: Deployment
metadata:
  name: immigration-tracker
  namespace: default
  labels:
    app: immigration-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immigration-tracker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: immigration-tracker
    spec:
      containers:
        - name: immigration-tracker
          image: ${HARBOR_REGISTRY_URL}/${HARBOR_PROJECT}/${IMAGE_NAME}:${VERSION}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      imagePullSecrets:
        - name: harbor-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: immigration-tracker-svc
  namespace: default
spec:
  selector:
    app: immigration-tracker
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immigration-tracker
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${SITE_NAME}.${PLATFORM}.${DOMAIN_NAME}`)
      kind: Rule
      services:
        - name: immigration-tracker-svc
          port: 80
